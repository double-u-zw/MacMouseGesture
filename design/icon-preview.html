<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>MacMouseGesture Icon QA</title><style>body{font:16px system-ui;margin:32px;background:#e8edf5;color:#192739}section{padding:24px;margin:18px 0;border-radius:16px;display:flex;align-items:center;gap:36px;background:#fff}.dark{background:#131c2b;color:white}figure{margin:0;text-align:center}figcaption{margin-top:10px;font-size:12px}img{object-fit:contain}h1{font-size:24px}</style><h1>MacMouseGesture · App Icon</h1><p>实际 PNG 尺寸预览；应用菜单栏继续使用单色模板图标。</p><div id="preview"></div><p>1024×1024 源图</p><img src="app-icon-source.png" width="512" height="512"><script>for(const dark of [false,true]){let s=document.createElement('section');s.className=dark?'dark':'';for(const size of [16,32,64,128,256]){let f=document.createElement('figure');let i=document.createElement('img');i.src='../Resources/MacMouseGesture.iconset/'+({16:'icon_16x16.png',32:'icon_32x32.png',64:'icon_32x32@2x.png',128:'icon_128x128.png',256:'icon_256x256.png'}[size]);i.width=i.height=size;let c=document.createElement('figcaption');c.textContent=size+' px';f.append(i,c);s.append(f)}document.querySelector('#preview').append(s)}</script></html>
